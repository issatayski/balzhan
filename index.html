<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEE8">
<title>Портфолио · Архитектура</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="app" hidden>

  <header class="stamp">
    <div class="stamp__cell stamp__cell--wide">
      <span class="stamp__label">Объект</span>
      <span class="stamp__value">Портфолио · Архитектура</span>
    </div>
    <div class="stamp__cell">
      <span class="stamp__label">Шифр</span>
      <span class="stamp__value stamp__value--mono">6B07310</span>
    </div>
    <div class="stamp__cell">
      <span class="stamp__label">Готовность</span>
      <span class="stamp__value stamp__value--mono" id="stampReady">—</span>
    </div>
    <div class="stamp__cell">
      <span class="stamp__label">Синхронизация</span>
      <span class="stamp__value stamp__value--mono" id="stampSync">—</span>
    </div>
  </header>

  <div class="bar" id="courseBar" role="group" aria-label="Курс"></div>

  <div class="bar bar--sub">
    <div class="chips" id="semBar" role="group" aria-label="Семестр"></div>
    <div class="chips" id="stateBar" role="group" aria-label="Состояние"></div>
  </div>

  <main id="list" class="list"></main>

  <footer class="foot">
    <button class="linkbtn" id="btnRefresh" type="button">Обновить</button>
    <button class="linkbtn" id="btnSettings" type="button">Настройки</button>
  </footer>
</div>

<section id="setup" class="setup" hidden>
  <h1 class="setup__title">Подключение таблицы</h1>
  <p class="setup__text">Вставьте адрес веб-приложения Google Apps Script. Он сохранится только в этом браузере — в коде сайта его нет.</p>
  <label class="setup__label" for="endpointInput">Адрес веб-приложения</label>
  <input class="setup__input" id="endpointInput" type="url" inputmode="url" spellcheck="false"
         placeholder="https://script.google.com/macros/s/.../exec">
  <p class="setup__err" id="setupErr" hidden></p>
  <button class="btn" id="btnConnect" type="button">Подключить</button>
  <button class="linkbtn setup__back" id="btnBack" type="button" hidden>Назад</button>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
